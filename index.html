        </div>
        <form id="searchForm" class="search-form">
          <input
            type="text"
            id="searchInput"
            placeholder="جستجو کن تا زودتر پیدا بشه ..."
            required
          />
          <button type="submit">جستجو</button>
        </form>

        <div style="display: flex; align-items: center; gap: 20px">
          <div id="authSection"></div>
          <div class="cart-icon">
            <img src="./images/cart-icon.png" alt="سبد خرید" id="cartIcon" />
            <span id="cartCount">0</span>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="content-wrapper">
        <!-- سایدبار -->
        <aside class="sidebar">
          <h3>فیلترها</h3>

          <!-- فیلتر بر اساس مواد اولیه -->
          <label for="ingredientSelect">فیلتر بر اساس مواد اولیه:</label>
          <select id="ingredientSelect">
            <option value="">انتخاب ماده اولیه</option>
            <option value="Chicken">مرغ</option>
            <option value="Beef">گوشت</option>
            <option value="Rice">برنج</option>
          </select>

          <!-- فیلتر بر اساس دسته‌بندی -->
          <label for="categorySelect">فیلتر بر اساس دسته‌بندی:</label>
          <select id="categorySelect">
            <option value="">انتخاب دسته‌بندی</option>
            <option value="Seafood">غذاهای دریایی</option>
            <option value="Vegetarian">گیاهی</option>
            <option value="Dessert">دسر</option>
            <option value="Lamb">گوشت بره</option>
            <option value="Pasta">پاستا</option>
            <option value="Pork">گوشت خوک</option>
            <option value="Side">ساید</option>
            <option value="Starter">پیش غذا</option>
            <option value="Vegan">وگان</option>
            <option value="Breakfast">صبحانه</option>
            <option value="Goat">گوشت بز</option>
            <option value="Miscellaneous">متفرقه</option>
          </select>
          <!-- دکمه پاک کردن فیلتر -->
          <button id="clearFilters">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
              width="20"
              height="20"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
              />
            </svg>
            <span>پاک کردن فیلترها</span>
          </button>
        </aside>
        <div id="notification" class="hidden"></div>

        <!-- ساختار مدال برای نمایش سبد خرید -->
        <div id="cartModal" class="modal">
          <div class="modal-content">
            <div class="modal-header">
              <h2>سبدخرید</h2>
              <span class="close">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="3"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 18 18 6M6 6l12 12"
                  />
                </svg>
              </span>
            </div>
            <table class="cart-table">
              <thead>
                <tr>
                  <th>تصویر</th>
                  <th>نام</th>
                  <th>قیمت</th>
                  <th>تعداد</th>
                  <th>مجموع</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="cartItems"></tbody>
            </table>
            <div class="footer-total">
              <div class="cart-total" id="cartTotal"></div>

              <button id="checkoutButton">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z"
                  />
                </svg>

                تکمیل سفارش
              </button>
            </div>

            <p class="footer-note" id="loginReminder">
              لطفا برای تکمیل سفارش به سایت لاگین کنید
            </p>
          </div>
        </div>

        <!-- بخش اصلی -->
        <section class="main-content">
          <section class="region-search">
            <h3>جستجو براساس ناحیه جغرافیایی</h3>
            <div class="region-buttons">
              <div data-region="French">
                <img src="images/france.jpg" alt="france flag" />

                فرانسوی
              </div>
              <div data-region="Canadian">
                <img src="images/canada.jpg" alt="canada flag" />

                کانادایی
              </div>
              <div data-region="Japanese">
                <img src="images/Japan.jpg" alt="Japan flag" />

                ژاپنی
              </div>
              <div data-region="Italian">
                <img src="images/italy.jpg" alt="italy flag" />

                ایتالیایی
              </div>
              <div data-region="Spanish">
                <img src="images/spania.jpg" alt="spania flag" />
                اسپانیایی
              </div>
              <div data-region="Chinese">
                <img src="images/china.jpg" alt="china flag" />

                چینی
              </div>
              <!-- <div data-region="Indian">هندی</div> -->
            </div>
          </section>

          <!-- لیست غذاها -->
          <section id="mealList" class="meal-list"></section>
        </section>
      </div>
    </main>

    <footer>
      <p>© 2024 Online Food Search. همه حقوق محفوظ است.</p>
    </footer>
