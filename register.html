<!-- register.html -->
<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌نام</title>
    <link rel="stylesheet" href="./webfonts/iransans-web/iransans.css" />

    <link rel="stylesheet" href="style-auth.css" />
    <style>
 
      input[type='text']:focus,
      input[type='password']:focus {
        outline: none;
        border: 1px solid #ff00a4;
        box-shadow: 0px 0px 5px #e00090;
      }

      /* دکمه ثبت‌نام */
      button[type='submit'] {
        background-color: #ff00a4;
      }

      button[type='submit']:hover {
        background-color: #e00090;
      }

      a {
        color: #ff00a4;
      }
    </style>
  </head>
  <body>
    <h2>ثبت‌نام</h2>
        <div id="notification" class="hidden"></div>

    <form id="registerForm">
      <input type="text" id="username" placeholder="نام کاربری" required />
      <input type="password" id="password" placeholder="رمز عبور" required />
      <button type="submit">ثبت‌نام</button>
    </form>
    <p>حساب دارید؟ <a href="login.html">ورود</a></p>
    <script src="register.js" ></script>
  </body>
</html>
